apiVersion: apps/v1
kind: Deployment
metadata:
  name: goal-v1
  labels:
    app: goal-tracker
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goal-tracker
      version: v1
  template:
    metadata:
      labels:
        app: goal-tracker
        version: v1
    spec:
      containers:
        - name: goal-tracker
          image: tanp77/goal-tracker:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: GOAL_TRACKER_DB
              value: /data/goals.sqlite3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          volumeMounts:
            - name: goal-data
              mountPath: /data
      volumes:
        - name: goal-data
          persistentVolumeClaim:
            claimName: goal-v1-data
