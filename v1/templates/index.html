<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goal Tracker {{ version }}</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #f3f4f6; margin: 0; color: #1f2937; }
    header { background: #2f3640; color: #fff; padding: 16px 24px; }
    header span { background: #6b7280; padding: 2px 10px; border-radius: 12px; font-size: 14px; margin: 0 8px; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
    input, textarea, select { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; font: inherit; }
    button, .btn { background: #374151; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font: inherit; }
    .tag { color: #4b5563; font-size: 13px; }
    .error { border-left: 4px solid #6b7280; background: #f3f4f6; padding: 8px 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <b>Goal Tracker</b> <span>{{ version }}</span> <small>Features: {{ features }}</small>
  </header>
  <main>
    <div class="card">
      <h2>Add Goal</h2>
      <form method="post" action="/add">
        <label>Title</label>
        <input name="title" required>
        <label>Description</label>
        <textarea name="description"></textarea>
        <button type="submit">Add Goal</button>
      </form>
    </div>

    <h2>All Goals</h2>
    {% for g in goals %}
    <div class="card">
      <h3>{{ g.title }}</h3>
      <p>{{ g.description }}</p>
    </div>
    {% else %}
    <div class="card"><i>No goals yet. Add your first goal above.</i></div>
    {% endfor %}
  </main>
</body>
</html>
